# GitHub Actions Workflow: Auto-create PR#2 after PR#1 merge
# Place this file in .github/workflows/ in the openshift-docs repository
#
# This workflow automatically creates a placeholder PR to the enterprise branch
# after a virt attributes update PR is merged to main.

name: Auto-create Virt Release Notes PR

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  create-placeholder-pr:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check if this is a virt attributes update PR
        id: check-pr
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          echo "Branch name: $BRANCH_NAME"

          # Check if branch matches pattern: virt-X-XX-Z-attributes-update
          if [[ $BRANCH_NAME =~ ^virt-([0-9]+)-([0-9]+)-([0-9]+)-attributes-update$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "match=true" >> $GITHUB_OUTPUT
            echo "major=$MAJOR" >> $GITHUB_OUTPUT
            echo "minor=$MINOR" >> $GITHUB_OUTPUT
            echo "patch=$PATCH" >> $GITHUB_OUTPUT
            echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT
            echo "version_dash=$MAJOR-$MINOR-$PATCH" >> $GITHUB_OUTPUT
            echo "enterprise_branch=enterprise-$MAJOR.$MINOR" >> $GITHUB_OUTPUT
          else
            echo "match=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-pr.outputs.match == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git
        if: steps.check-pr.outputs.match == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR#2 branch
        if: steps.check-pr.outputs.match == 'true'
        env:
          MAJOR: ${{ steps.check-pr.outputs.major }}
          MINOR: ${{ steps.check-pr.outputs.minor }}
          PATCH: ${{ steps.check-pr.outputs.patch }}
          VERSION_DASH: ${{ steps.check-pr.outputs.version_dash }}
          ENTERPRISE_BRANCH: ${{ steps.check-pr.outputs.enterprise_branch }}
        run: |
          # Fetch and checkout enterprise branch
          git fetch origin $ENTERPRISE_BRANCH
          git checkout -b virt-$VERSION_DASH-release-notes-placeholder origin/$ENTERPRISE_BRANCH

          # Copy release notes file from main (merged PR#1)
          git checkout main -- virt/release_notes/virt-$VERSION_DASH-release-notes.adoc

          # Commit the file
          git add virt/release_notes/virt-$VERSION_DASH-release-notes.adoc
          git commit -m "Add OpenShift Virtualization $MAJOR.$MINOR.$PATCH release notes placeholder

Added placeholder release notes file for $MAJOR.$MINOR.$PATCH (copied from main branch).
This follows the merge of PR #${{ github.event.pull_request.number }}.

Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Push and create PR#2
        if: steps.check-pr.outputs.match == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check-pr.outputs.version }}
          VERSION_DASH: ${{ steps.check-pr.outputs.version_dash }}
          ENTERPRISE_BRANCH: ${{ steps.check-pr.outputs.enterprise_branch }}
          PR1_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Push branch
          git push origin virt-$VERSION_DASH-release-notes-placeholder

          # Create PR using gh CLI
          gh pr create \
            --base "$ENTERPRISE_BRANCH" \
            --head "virt-$VERSION_DASH-release-notes-placeholder" \
            --title "Add OpenShift Virtualization $VERSION release notes placeholder" \
            --body "## Summary
Add placeholder release notes file for OpenShift Virtualization $VERSION to the $ENTERPRISE_BRANCH branch.

## Description
This PR was automatically created after the merge of PR #$PR1_NUMBER.

It adds a placeholder release notes file for OpenShift Virtualization $VERSION (z-stream) to the $ENTERPRISE_BRANCH branch. This file is copied from the dummy file on main and will be populated with actual release notes content.

Changes:
- Created \`virt/release_notes/virt-$VERSION_DASH-release-notes.adoc\`

**Note**: Version attribute updates were handled in PR #$PR1_NUMBER on the main branch.

## Test plan
- [ ] Verify placeholder file structure is correct
- [ ] Confirm builds pass on $ENTERPRISE_BRANCH branch

🤖 Auto-generated by GitHub Actions"

      - name: Log result
        if: steps.check-pr.outputs.match == 'true'
        run: |
          echo "✅ Successfully created PR#2 for virt ${{ steps.check-pr.outputs.version }}"
          echo "Enterprise branch: ${{ steps.check-pr.outputs.enterprise_branch }}"
